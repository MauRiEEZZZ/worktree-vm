# /etc/wsl.conf — worktree-vm settings for the WSL2 distro.
# Install:  sudo cp platform/wsl/wsl.conf /etc/wsl.conf
# then restart the distro from Windows (PowerShell):  wsl --shutdown
#
# systemd must be PID 1 inside the distro — Docker, the dashboard unit and the
# (optional) sshd all need it. It is opt-in in WSL2, via exactly this setting.
[boot]
systemd=true

# NOTE: VM-wide resources (memory/processors) do NOT belong in this file — set
# those on the Windows side in %UserProfile%\.wslconfig, e.g.:
#   [wsl2]
#   memory=8GB
#   processors=4
#
# Networking: no port forwarding setup is needed. localhostForwarding is on by
# default, so anything bound inside the distro (the dashboard, dev servers) is
# reachable at localhost:<port> on Windows. `networkingMode=mirrored` (in
# .wslconfig, Windows 11 22H2+) is the cleaner modern option if you need more.
