# worktree-vm configuration
# ==========================
# Copy this file to ~/.config/wt/config.yaml and edit it, then run:
#   lib/config/generate-env.sh
# (install.sh does both automatically). The generator turns this file into two
# derived files that the tooling actually reads at runtime:
#   ~/.config/wt/env.sh          sourced by the wt-* shell library
#   ~/.config/wt/dashboard.env   EnvironmentFile= for the dashboard systemd unit
#
# Supported YAML subset: two levels of 2-space-indented maps, scalar values,
# and lists (inline `[a, b]` or 2-space-indented `- item` lines). Quote values
# that contain `#` or `:`. `~/` at the start of a path expands to $HOME.

# Repo registry: short key -> GitHub owner/repo. The key names the clone
# (~/repos/<key>), the worktrees (~/wt/<key>/<name>) and the session ids
# (<key>--<name>). Empty registry = wt-new has nothing to target yet.
repos:
  # myrepo: my-org/my-repo
  # infra: my-org/my-infra

# Clone-path overrides: key -> absolute path of the main clone. Use this when a
# repo's main clone lives somewhere other than ~/repos/<key> (e.g. a pre-existing
# clone you don't want to move). An entry here wins unconditionally.
clone_paths:
  # myrepo: ~/my-legacy-clone

# Branch that new worktrees fall back to when the clone's origin/HEAD cannot be
# resolved (also the review merge-base fallback).
default_base_branch: main

github:
  # Org/user whose PRs the dashboard's PR-review watcher polls for
  # review-requests addressed to you. Empty = watcher off.
  review_owner: ""
  # Model for WATCHER review sessions (auto-started for PRs where your review
  # is requested). WHY ITS OWN KEY: that is someone ELSE's PR — you read the
  # report and decide yourself, so a missed nuance costs you no lead time.
  # Mid-tier is the sensible spend here. Empty = your account default.
  review_model: ""

agents:
  # Agent that wt-new launches when --agent is not given: claude | codex.
  default: claude
  #
  # THE MODEL KEYS — there are deliberately THREE (this one, agents.review_model
  # and github.review_model above), with three different uses and typically
  # three different values. Do not "clean them up" into one; each reason below
  # is why the previous merges were reverted. None of them is hardwired to any
  # model, and empty always means: fall back to your ACCOUNT default (which may
  # be your most expensive model — these are cost/quality knobs).
  #
  # Model for new DEV sessions when no --model is given (Claude only; an
  # explicit --model or the dashboard dropdown always wins; the literal
  # '--model default' forces the account default; change a live session later
  # with wt-model). WHY: recommended MID-TIER, explicitly not the cheapest —
  # dev work in a real codebase is not purely pattern-following: finding a
  # second bug path while fixing the first, checking whether a component
  # actually exists instead of inventing it, refusing to push because the
  # conventions say so. That behaviour is the first thing the cheapest tier
  # loses. The CHEAPEST tier is fine for mechanical work (dependency-bump
  # follow-ups, renames, doc-only changes) — pass it per session with --model;
  # that is a recommendation, not enforcement.
  default_model: ""
  # Model for PRE-PR SELF-REVIEW sessions (manual wt-review and the dashboard's
  # review button). WHY ITS OWN KEY, and why the STRONGEST tier you are willing
  # to pay for: this is the gate that saves a full day of external
  # comment -> fix -> re-review round-trip, and the work is not reading — it is
  # forming hypotheses, building and running experiments, reverting fixes to
  # prove tests discriminate. The failure mode is asymmetric: a weak reviewer
  # reporting "no findings" is WORSE than no reviewer, because the work then
  # proceeds with a stamp on it. Empty = your account default — deliberately
  # NOT default_model, so a self-review never silently inherits the dev tier.
  review_model: ""
  # Model aliases offered in the dashboard's model dropdown (Claude only).
  # The empty "default" choice is always offered in addition to these.
  model_choices: [opus, sonnet, haiku]

dashboard:
  port: 7300
  # Regex that recognises deploy/preview URLs in PR descriptions/comments; the
  # first match becomes the card's "deploy" link. Empty = feature off.
  # Example (Azure App Service + Static Web Apps preview environments):
  #   'https?://[a-z0-9.-]*-(?:pr-?)?\d+[a-z0-9.-]*\.(?:example-paas)\.net[^\s)\]]*'
  deploy_url_regex: ""
  # SSH alias/host of this VM as reachable FROM your workstation. Used in the
  # copy-attach and port-forward one-liners the dashboard offers. Empty = the
  # one-liners omit the ssh hop (plain tmux commands).
  ssh_host: ""

ide:
  # IDE backend for wt-ide: none | rider | code-server. `none` (default) keeps
  # IDE support off entirely.
  backend: none
  # First local port for per-worktree IDE instances (code-server backend).
  port_base: 6000
  # JetBrains Rider version for the rider backend (downloaded on first use).
  rider_version: 2026.1.3

secrets:
  # Durable folder holding per-repo gitignored local config (repo-relative
  # paths under <source>/<key>/). wt-seed-main copies from here into the main
  # clones. Empty = wt-seed-main only runs the seed-main hook.
  source: ""

sessions:
  # Where the dashboard keeps per-session metadata JSON (tombstones of deleted
  # sessions live in <dir>/archive). Point this at an existing directory if you
  # are migrating from an older setup with live session data.
  meta_dir: ~/.wt-sessions

hooks:
  # Directory with your hook scripts (<name>.sh). See hooks/README.md for the
  # contract. Hooks are best-effort: a failing hook warns and continues.
  dir: ~/.config/wt/hooks

# Opt-in toolchains installed by provision/90-stacks.sh. Available:
# dotnet, powershell, azure-cli, pulumi, playwright. Empty = none.
stacks: []

# Per-stack settings (only read when the stack is enabled).
stack_options:
  # Exact .NET SDK version for the dotnet stack (e.g. 10.0.301) — pin it when a
  # project's global.json demands a specific band. Empty = the latest LTS
  # channel. The WT_DOTNET_VERSION environment variable overrides this.
  dotnet_version: ""
  # Browsers for the playwright stack (headless-only; see the stack script).
  # Firefox is deliberately included by default — it is the browser the
  # product's users actually use; drop it here only if you truly need just
  # chromium's quick checks (that also skips firefox's system packages).
  playwright_browsers: [chromium, firefox]
  # Playwright version for the stack (empty = latest). The
  # WT_PLAYWRIGHT_VERSION environment variable overrides this.
  playwright_version: ""

# Extra guest ports your projects need forwarded to the host. On macOS/Lima
# these become portForwards (the dashboard port above is always forwarded); on
# WSL2 no forwarding is needed (localhost forwarding is on by default).
ports: []

lima:
  # Only used by platform/lima/up.sh on the macOS host.
  instance: worktree-vm
  # Defaults fit a small laptop; several parallel agent sessions (or the dotnet
  # stack + docker-heavy dev) are happier with 4 cpus / 8GiB or more.
  cpus: 2
  memory: 4GiB
  disk: 100GiB   # sparse — only actually-used space is allocated
  # Persistent Lima data disk: survives `limactl delete` + rebuild. up.sh
  # creates it when missing; the VM bind-mounts ~/wt onto it and symlinks the
  # durable dirs (~/repos, ~/.claude, ~/.codex, ~/.config/gh, ~/.config/wt,
  # ~/.azure, ~/.wt-meta, the sessions.meta_dir directory, plus any clone_paths
  # under your home; ~/.claude.json is persisted by copy). Empty = no persistence.
  data_disk: worktree-data
  data_disk_size: 60GiB
